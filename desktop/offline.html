<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كنز — لا يوجد اتصال</title>
<style>
  :root { --bg: #f8fafc; --card: #fff; --text: #1e293b; --muted: #64748b; --primary: #4f46e5; --border: #e2e8f0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --primary: #818cf8; --border: #334155; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: var(--bg); color: var(--text); font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif; line-height: 1.9; }
  main { max-width: 520px; text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 32px 24px; }
  .ic { width: 64px; height: 64px; margin: 0 auto 6px; border-radius: 50%; display: grid; place-items: center; background: rgba(79, 70, 229, .1); color: var(--primary); }
  .ic svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  h1 { font-size: 1.4rem; margin: 8px 0; }
  p { color: var(--muted); margin: 6px 0; }
  a.btn { display: inline-block; margin-top: 16px; padding: 10px 22px; border-radius: 12px; background: var(--primary); color: #fff; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></svg></div>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>يفتح البرنامج عادةً بدون إنترنت من النسخة الموجودة داخل التطبيق، فظهور هذه الصفحة يعني أنه تعذّر فتحها.</p>
  <p>تأكد من الاتصال ثم أعد المحاولة. وإن تكرر ذلك فأعد تثبيت التطبيق من صفحة التحميل. بياناتك المحاسبية محفوظة على جهازك ولم تتأثر.</p>
  <a class="btn" id="retry" href="#">إعادة المحاولة</a>
</main>
<script>
  // الرابط يصل من البرنامج نفسه. نقبل فقط https (أو العنوان المحلي للتطوير)
  try {
    const u = new URL(new URLSearchParams(location.search).get('u') || '');
    if (u.protocol === 'https:' || u.hostname === '127.0.0.1' || u.hostname === 'localhost') document.getElementById('retry').href = u.href;
  } catch (e) { /* يبقى الزر بلا رابط */ }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصفحة غير موجودة — كنز</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/ahsebha/icons/icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; }
  body { font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; background: #f8fafc; color: #1e293b; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #f1f5f9; } }
  h1 { font-size: 1.4rem; margin: 12px 0 8px; }
  p { color: #64748b; line-height: 1.8; margin: 0 0 18px; }
  a { display: inline-block; background: #4f46e5; color: #fff; font-weight: 700; padding: 12px 22px; border-radius: 12px; text-decoration: none; box-shadow: 0 6px 16px rgba(79, 70, 229, .3); }
</style>
</head>
<body>
<main>
  <img src="/ahsebha/icons/icon.svg" alt="" width="72" height="72" style="border-radius:18px">
  <h1>هذه الصفحة لم تعد موجودة</h1>
  <p>كنز (احسبها سابقاً) برنامج محاسبة متكامل ومجاني: فواتير ضريبية، مخزون، قيود وتقارير.</p>
  <a id="home" href="/ahsebha/">افتح برنامج المحاسبة ←</a>
</main>
<script>
  // الموقع منشور تحت /ahsebha/ على GitHub Pages؛ نحوّل الزائر للبرنامج بعد لحظات
  var base = location.pathname.indexOf('/ahsebha/') === 0 ? '/ahsebha/' : '/';
  document.getElementById('home').href = base;
  setTimeout(function () { location.replace(base); }, 4000);
</script>
</body>
</html>

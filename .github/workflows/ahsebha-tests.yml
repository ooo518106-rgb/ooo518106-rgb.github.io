name: اختبارات كنز

on:
  pull_request:
    paths:
      - 'ahsebha/**'
      - 'cloud/**'
      - '.github/workflows/ahsebha-tests.yml'
  push:
    branches: [main]
    paths:
      - 'ahsebha/**'
      - 'cloud/**'
      - '.github/workflows/ahsebha-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ahsebha-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: اختبارات تطبيق المحاسبة
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ahsebha
    steps:
      - name: تنزيل المستودع
        uses: actions/checkout@v4

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: تشغيل الاختبارات
        run: npm test


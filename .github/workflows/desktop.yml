name: تطبيق سطح المكتب

# يبني برنامج احسبها لويندوز وماك ولينكس، ويشغّله فعلياً للتأكد أنه يعمل، وينشره عند الطلب.
on:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'انشر الإصدار على صفحة Releases'
        type: boolean
        default: false
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: بناء ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, flag: '--win' }
          - { os: macos-latest, name: mac, flag: '--mac' }
          - { os: ubuntu-latest, name: linux, flag: '--linux' }
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: تثبيت الأدوات
        run: npm ci

      - name: اختبار القواعد
        run: npm test

      - name: بناء ملف التثبيت
        run: npx electron-builder ${{ matrix.flag }} --publish never

      - name: اختبار التشغيل (لينكس)
        if: matrix.name == 'linux'
        timeout-minutes: 3
        run: |
          xvfb-run -a ./dist/linux-unpacked/ahsebha --no-sandbox --smoke-test --smoke-out="$RUNNER_TEMP/smoke.json"
          cat "$RUNNER_TEMP/smoke.json"

      - name: اختبار صفحة «لا يوجد اتصال» (لينكس)
        if: matrix.name == 'linux'
        timeout-minutes: 3
        env:
          AHSEBHA_URL: http://127.0.0.1:1/ahsebha/
        run: |
          xvfb-run -a ./dist/linux-unpacked/ahsebha --no-sandbox --smoke-offline --smoke-out="$RUNNER_TEMP/smoke-offline.json"
          cat "$RUNNER_TEMP/smoke-offline.json"

      - name: اختبار العمل بدون إنترنت (لينكس) — نسخة هذا التعديل نفسها
        if: matrix.name == 'linux'
        timeout-minutes: 5
        working-directory: .
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &
          SERVER=$!
          sleep 2
          curl -sf http://127.0.0.1:8765/ahsebha/ >/dev/null
          export AHSEBHA_URL=http://127.0.0.1:8765/ahsebha/
          APP=./desktop/dist/linux-unpacked/ahsebha
          PROFILE="$RUNNER_TEMP/profile"
          echo "--- التشغيل الأول: بإنترنت، يحفظ البرنامج نفسه"
          xvfb-run -a $APP --no-sandbox --smoke-test --smoke-user-data="$PROFILE" --smoke-out="$RUNNER_TEMP/run1.json"
          cat "$RUNNER_TEMP/run1.json"
          kill $SERVER
          sleep 1
          echo "--- التشغيل الثاني: بدون أي إنترنت (الخادم متوقف)"
          xvfb-run -a $APP --no-sandbox --smoke-test --smoke-user-data="$PROFILE" --smoke-no-network --smoke-out="$RUNNER_TEMP/run2.json"
          cat "$RUNNER_TEMP/run2.json"

      - name: اختبار ملف AppImage نفسه (لينكس)
        if: matrix.name == 'linux'
        timeout-minutes: 3
        run: |
          chmod +x ./dist/Ahsebha-linux-x64.AppImage
          xvfb-run -a ./dist/Ahsebha-linux-x64.AppImage --appimage-extract-and-run --no-sandbox --smoke-test --smoke-out="$RUNNER_TEMP/smoke-appimage.json"
          cat "$RUNNER_TEMP/smoke-appimage.json"

      - name: 'اختبار العمل بدون إنترنت — الموقع الحقيقي (لينكس)'
        if: matrix.name == 'linux'
        timeout-minutes: 8
        run: |
          # كل اتصال مرفوض (وكيل غير موجود). نتأكد أن النسخة الكاملة داخل التطبيق، وأنه يعمل بدون إنترنت من أول تشغيل ومن بعده
          test -f ./dist/linux-unpacked/resources/ahsebha/index.html
          test -f ./dist/linux-unpacked/resources/ahsebha/vendor/ocr/ara.traineddata.gz
          RUN="xvfb-run -a ./dist/linux-unpacked/ahsebha --no-sandbox"
          CUT=--proxy-server=127.0.0.1:9
          FIRST="$RUNNER_TEMP/profile-first"
          REAL="$RUNNER_TEMP/profile-real"
          echo "--- أول تشغيل بدون أي إنترنت: يجب أن يظهر البرنامج من النسخة المرفقة"
          $RUN --smoke-test --smoke-no-network $CUT --smoke-user-data="$FIRST" --smoke-out="$RUNNER_TEMP/first.json"
          node ci/check.js "$RUNNER_TEMP/first.json" "r.ok && r.offlineSite.bundle >= 5 && r.offlineSite.net === 0" "أول تشغيل بدون إنترنت: من النسخة المرفقة"
          echo "--- تشغيل ثانٍ بدون إنترنت (نفس الجهاز)"
          $RUN --smoke-test --smoke-no-network $CUT --smoke-user-data="$FIRST" --smoke-out="$RUNNER_TEMP/first2.json"
          node ci/check.js "$RUNNER_TEMP/first2.json" "r.ok" "ثاني تشغيل بدون إنترنت"
          echo "--- تشغيل بإنترنت من الموقع الحقيقي: يحفظ النسخة الأحدث"
          $RUN --smoke-test --smoke-user-data="$REAL" --smoke-out="$RUNNER_TEMP/real1.json"
          node ci/check.js "$RUNNER_TEMP/real1.json" "r.ok && r.sw >= 20 && r.offlineSite.net >= 5" "بإنترنت: من الشبكة ويحفظ نسخته"
          echo "--- تشغيل بدون إنترنت بعد تشغيل بإنترنت"
          $RUN --smoke-test --smoke-no-network --disable-http-cache $CUT --smoke-user-data="$REAL" --smoke-out="$RUNNER_TEMP/real2.json"
          node ci/check.js "$RUNNER_TEMP/real2.json" "r.ok" "بدون إنترنت بعد تشغيل بإنترنت"

      - name: اختبار التشغيل (ويندوز)
        if: matrix.name == 'windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $p = Start-Process -FilePath '.\dist\win-unpacked\Ahsebha.exe' -ArgumentList '--smoke-test', "--smoke-out=$out" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out }
          if ($p.ExitCode -ne 0) { throw "فشل اختبار التشغيل: رمز الخروج $($p.ExitCode)" }

      - name: اختبار التثبيت الفعلي (ويندوز)
        if: matrix.name == 'windows'
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path .\dist\Ahsebha-Setup.exe).Path
          $p = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          Write-Host "رمز خروج المثبّت: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "فشل التثبيت: رمز الخروج $($p.ExitCode)" }
          # أين ثُبّت؟ نسأل سجل ويندوز (مدخل إلغاء التثبيت)
          function Get-Entry {
            Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like '*hsebha*' -or $_.DisplayName -like '*احسبها*' }
          }
          $entry = $null
          for ($i = 0; $i -lt 60 -and -not $entry; $i++) { $entry = @(Get-Entry)[0]; if (-not $entry) { Start-Sleep -Seconds 1 } }
          if ($entry) { $entry | Format-List DisplayName, DisplayVersion, InstallLocation, UninstallString, DisplayIcon }
          Write-Host '--- المجلدات المحتملة ---'
          Get-ChildItem "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Programs: $($_.FullName)" }
          Get-ChildItem $env:ProgramFiles -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*hsebha*' } | ForEach-Object { Write-Host "ProgramFiles: $($_.FullName)" }
          if (-not $entry) { throw 'لا يوجد مدخل للبرنامج في سجل ويندوز بعد التثبيت' }
          # مسار الأيقونة في مدخل ويندوز هو مسار البرنامج المثبّت (مثل ...\Ahsebha.exe,0)
          $exe = ($entry.DisplayIcon -replace ',\d+$', '').Trim('"')
          $dir = Split-Path $exe
          Write-Host "مكان التثبيت: $dir"
          if (-not (Test-Path $exe)) { throw "لم يُثبَّت البرنامج في $dir" }
          $desktop = [Environment]::GetFolderPath('Desktop')
          $start = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          Write-Host "سطح المكتب: $desktop"; Get-ChildItem $desktop -Filter *.lnk | ForEach-Object { Write-Host "  $($_.Name)" }
          Write-Host "قائمة ابدأ: $start"; Get-ChildItem $start -Filter *.lnk | ForEach-Object { Write-Host "  $($_.Name)" }
          if (-not (Test-Path (Join-Path $desktop 'احسبها.lnk'))) { throw 'لا يوجد اختصار «احسبها» على سطح المكتب' }
          if (-not (Test-Path (Join-Path $start 'احسبها.lnk'))) { throw 'لا يوجد اختصار «احسبها» في قائمة ابدأ' }
          $out = Join-Path $env:RUNNER_TEMP 'smoke-installed.json'
          $r = Start-Process -FilePath $exe -ArgumentList '--smoke-test', "--smoke-out=$out" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out }
          if ($r.ExitCode -ne 0) { throw "فشل تشغيل النسخة المثبّتة: رمز الخروج $($r.ExitCode)" }
          # بدون إنترنت (الموقع الحقيقي والنسخة المثبّتة): نتأكد أن النسخة الكاملة داخل التثبيت، وأن التطبيق يعمل بدون إنترنت من أول تشغيل ومن بعده
          if (-not (Test-Path (Join-Path $dir 'resources\ahsebha\index.html'))) { throw 'النسخة الكاملة للبرنامج ليست داخل التثبيت' }
          $cut = '--proxy-server=127.0.0.1:9'
          $first = Join-Path $env:RUNNER_TEMP 'profile-first'
          $real = Join-Path $env:RUNNER_TEMP 'profile-real'
          function Invoke-Smoke([string]$name, [string[]]$more, [string]$expr, [string]$label) {
            $o = Join-Path $env:RUNNER_TEMP "$name.json"
            if (Test-Path $o) { Remove-Item $o }
            $argList = @("--smoke-out=$o") + $more
            $q = Start-Process -FilePath $exe -ArgumentList $argList -Wait -PassThru
            if (Test-Path $o) { Write-Host (Get-Content $o -Raw) }
            if ($q.ExitCode -ne 0) { throw "فشل ($name): رمز الخروج $($q.ExitCode)" }
            node ci/check.js $o $expr $label
            if ($LASTEXITCODE -ne 0) { throw "فشل الشرط ($name): $label" }
          }
          Write-Host '--- أول تشغيل بدون أي إنترنت: يجب أن يظهر البرنامج من النسخة المرفقة'
          Invoke-Smoke 'first' @('--smoke-test', '--smoke-no-network', $cut, "--smoke-user-data=$first") 'r.ok && r.offlineSite.bundle >= 5 && r.offlineSite.net === 0' 'أول تشغيل بدون إنترنت: من النسخة المرفقة'
          Write-Host '--- تشغيل ثانٍ بدون إنترنت (نفس الجهاز)'
          Invoke-Smoke 'first2' @('--smoke-test', '--smoke-no-network', $cut, "--smoke-user-data=$first") 'r.ok' 'ثاني تشغيل بدون إنترنت'
          Write-Host '--- تشغيل بإنترنت من الموقع الحقيقي: يحفظ النسخة الأحدث'
          Invoke-Smoke 'real1' @('--smoke-test', "--smoke-user-data=$real") 'r.ok && r.sw >= 20 && r.offlineSite.net >= 5' 'بإنترنت: من الشبكة ويحفظ نسخته'
          Write-Host '--- تشغيل بدون إنترنت بعد تشغيل بإنترنت'
          Invoke-Smoke 'real2' @('--smoke-test', '--smoke-no-network', '--disable-http-cache', $cut, "--smoke-user-data=$real") 'r.ok' 'بدون إنترنت بعد تشغيل بإنترنت'
          Write-Host 'العمل بدون إنترنت على النسخة المثبّتة: سليم'
          $un = Join-Path $dir 'Uninstall Ahsebha.exe'
          if (-not (Test-Path $un)) { throw 'لا يوجد برنامج إلغاء التثبيت' }
          Start-Process -FilePath $un -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw 'لم يُحذف البرنامج بعد إلغاء التثبيت' }
          if (Test-Path (Join-Path $desktop 'احسبها.lnk')) { throw 'بقي الاختصار على سطح المكتب بعد إلغاء التثبيت' }
          Write-Host 'تثبيت وتشغيل وإلغاء تثبيت: سليم'

      - name: اختبار التشغيل (ماك)
        if: matrix.name == 'mac'
        timeout-minutes: 3
        run: |
          ./dist/mac-arm64/Ahsebha.app/Contents/MacOS/Ahsebha --smoke-test --smoke-out="$RUNNER_TEMP/smoke.json"
          cat "$RUNNER_TEMP/smoke.json"

      - name: 'اختبار القرص (ماك) — تركيب ونسخ إلى Applications وتشغيل'
        if: matrix.name == 'mac'
        timeout-minutes: 5
        run: |
          hdiutil attach dist/Ahsebha-mac-arm64.dmg -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg"
          ls "$RUNNER_TEMP/dmg"
          rm -rf "$HOME/Applications/Ahsebha.app" && mkdir -p "$HOME/Applications"
          cp -R "$RUNNER_TEMP/dmg/Ahsebha.app" "$HOME/Applications/"
          hdiutil detach "$RUNNER_TEMP/dmg"
          APP="$HOME/Applications/Ahsebha.app"
          plutil -p "$APP/Contents/Info.plist" | grep -E 'CFBundleDisplayName|CFBundleName|NSCameraUsageDescription|CFBundleIdentifier'
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            codesign -dv "$APP" 2>&1 | grep -E 'Signature|Identifier' || true
            codesign --verify --deep --strict --verbose=2 "$APP"
          fi
          "$APP/Contents/MacOS/Ahsebha" --smoke-test --smoke-out="$RUNNER_TEMP/smoke-dmg.json"
          cat "$RUNNER_TEMP/smoke-dmg.json"
          # بدون إنترنت (الموقع الحقيقي والنسخة المنسوخة إلى Applications): نتأكد أن النسخة الكاملة داخل التطبيق، وأنه يعمل بدون إنترنت من أول تشغيل ومن بعده
          test -f "$APP/Contents/Resources/ahsebha/index.html"
          BIN="$APP/Contents/MacOS/Ahsebha"
          CUT=--proxy-server=127.0.0.1:9
          FIRST="$RUNNER_TEMP/profile-first"
          REAL="$RUNNER_TEMP/profile-real"
          echo "--- أول تشغيل بدون أي إنترنت: يجب أن يظهر البرنامج من النسخة المرفقة"
          "$BIN" --smoke-test --smoke-no-network $CUT --smoke-user-data="$FIRST" --smoke-out="$RUNNER_TEMP/first.json"
          node ci/check.js "$RUNNER_TEMP/first.json" "r.ok && r.offlineSite.bundle >= 5 && r.offlineSite.net === 0" "أول تشغيل بدون إنترنت: من النسخة المرفقة"
          echo "--- تشغيل ثانٍ بدون إنترنت (نفس الجهاز)"
          "$BIN" --smoke-test --smoke-no-network $CUT --smoke-user-data="$FIRST" --smoke-out="$RUNNER_TEMP/first2.json"
          node ci/check.js "$RUNNER_TEMP/first2.json" "r.ok" "ثاني تشغيل بدون إنترنت"
          echo "--- تشغيل بإنترنت من الموقع الحقيقي: يحفظ النسخة الأحدث"
          "$BIN" --smoke-test --smoke-user-data="$REAL" --smoke-out="$RUNNER_TEMP/real1.json"
          node ci/check.js "$RUNNER_TEMP/real1.json" "r.ok && r.sw >= 20 && r.offlineSite.net >= 5" "بإنترنت: من الشبكة ويحفظ نسخته"
          echo "--- تشغيل بدون إنترنت بعد تشغيل بإنترنت"
          "$BIN" --smoke-test --smoke-no-network --disable-http-cache $CUT --smoke-user-data="$REAL" --smoke-out="$RUNNER_TEMP/real2.json"
          node ci/check.js "$RUNNER_TEMP/real2.json" "r.ok" "بدون إنترنت بعد تشغيل بإنترنت"

      - name: 'اختبار قرص ماك Intel — نفس الخطوات عبر Rosetta'
        if: matrix.name == 'mac'
        timeout-minutes: 8
        run: |
          # جهاز البناء بمعالج Apple، فنشغّل نسخة Intel الموجودة داخل قرصها عبر Rosetta
          hdiutil attach dist/Ahsebha-mac-x64.dmg -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg-x64"
          rm -rf "$RUNNER_TEMP/x64" && mkdir -p "$RUNNER_TEMP/x64"
          cp -R "$RUNNER_TEMP/dmg-x64/Ahsebha.app" "$RUNNER_TEMP/x64/"
          hdiutil detach "$RUNNER_TEMP/dmg-x64"
          APP="$RUNNER_TEMP/x64/Ahsebha.app"
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/Ahsebha")"
          echo "معمارية الملف: $ARCHS"
          [ "$ARCHS" = "x86_64" ]
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            codesign --verify --deep --strict --verbose=2 "$APP"
          fi
          if ! /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license || true
          fi
          test -f "$APP/Contents/Resources/ahsebha/index.html"
          if /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 "$APP/Contents/MacOS/Ahsebha" --smoke-test --smoke-out="$RUNNER_TEMP/smoke-x64.json"
            cat "$RUNNER_TEMP/smoke-x64.json"
            echo "--- أول تشغيل بدون أي إنترنت (نسخة Intel): يجب أن يظهر البرنامج من النسخة المرفقة"
            arch -x86_64 "$APP/Contents/MacOS/Ahsebha" --smoke-test --smoke-no-network --proxy-server=127.0.0.1:9 --smoke-user-data="$RUNNER_TEMP/profile-x64" --smoke-out="$RUNNER_TEMP/first-x64.json"
            node ci/check.js "$RUNNER_TEMP/first-x64.json" "r.ok && r.offlineSite.bundle >= 5 && r.offlineSite.net === 0" "نسخة Intel: أول تشغيل بدون إنترنت"
          else
            echo "::warning::لا يتوفر Rosetta على جهاز البناء فلم تُشغَّل نسخة Intel. تأكدنا فقط أن الملف بمعمارية Intel"
          fi

      - name: عرض الملفات الناتجة
        shell: bash
        run: ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  release:
    name: نشر الإصدار
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'workflow_dispatch' && inputs.release) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installer-*
          merge-multiple: true

      - name: إنشاء الإصدار أو تحديثه
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="desktop-v${VERSION}"
          ls -la installers
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" installers/* --clobber
          else
            gh release create "$TAG" installers/* --target "$GITHUB_SHA" --title "احسبها لسطح المكتب ${VERSION}" --notes-file desktop/RELEASE_NOTES.md
          fi
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | .name + " " + (.size|tostring))'
